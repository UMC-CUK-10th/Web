<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property Study</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>UMC Workbook</h1>

        <section>
            <h2>block</h2>
            <div class="block">block 요소는 한 줄을 전부 차지해요.</div>
            <div class="block">그래서 줄이 자동으로 바뀌고, 다른 요소들은 그 다음 줄에 배치돼요.</div>
        </section>

        <section>
            <h2>inline</h2>
            <div class="inline-wrapper">
                <span class="inline">inline 요소는 자기 크기만큼만 공간을 차지해요.</span>
                <span class="inline">만약 옆에 남은 공간이 부족하면, 자동으로 다음 줄로 넘어가요.</span>
            </div>
        </section>

        <section>
            <h2>inline-block</h2>
            <div class="test-inline">inline 방식과 같이 요소는 자기 크기 만큼만 공간을 차지하지만</div>
            <div class="test-inline-block">inline-block은 크기 조절이 가능해요.</div>
        </section>
    </div>

</body>
</html>
